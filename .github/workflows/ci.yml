name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Unit tests (RecorderCore)
        run: swift test

      - name: Build app
        run: |
          xcodebuild \
            -project Recorder.xcodeproj \
            -target Recorder \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

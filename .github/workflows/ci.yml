name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Unit tests (RecorderCore)
        run: swift test

      - name: Check signing configuration
        run: |
          show_settings() {
            xcodebuild -project Recorder.xcodeproj -target Recorder -configuration Debug -showBuildSettings 2>/dev/null
          }
          expect_setting() {
            # expect_setting <settings> <NAME> <value regex>
            if ! grep -qE "^[[:space:]]*$2 = $3\$" <<<"$1"; then
              echo "::error::Expected $2 = $3"
              grep -E "^[[:space:]]*$2 = " <<<"$1" || echo "($2 is not set)"
              exit 1
            fi
          }

          # No Config/Local.xcconfig (a fresh clone, or CI): ad-hoc fallback.
          settings="$(show_settings)"
          grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|ENABLE_HARDENED_RUNTIME|CODE_SIGN_ENTITLEMENTS) = ' <<<"$settings" || true
          expect_setting "$settings" PRODUCT_BUNDLE_IDENTIFIER 'app\.hypher\.recorder'
          expect_setting "$settings" CODE_SIGN_IDENTITY '-'
          expect_setting "$settings" ENABLE_HARDENED_RUNTIME YES
          expect_setting "$settings" CODE_SIGN_ENTITLEMENTS 'Recorder/Recorder\.entitlements'

          # With a team configured: signs with the Apple Development certificate.
          scripts/configure-signing.sh ABCDE12345 > /dev/null
          team_settings="$(show_settings)"
          rm Config/Local.xcconfig
          expect_setting "$team_settings" CODE_SIGN_IDENTITY 'Apple Development'
          expect_setting "$team_settings" DEVELOPMENT_TEAM ABCDE12345

          # Developer ID (scripts/release.sh): manual signing with a secure timestamp.
          release_settings="$(xcodebuild -project Recorder.xcodeproj -target Recorder -configuration Release -showBuildSettings RECORDER_SIGNING=developerid DEVELOPMENT_TEAM=ABCDE12345 2>/dev/null)"
          expect_setting "$release_settings" CODE_SIGN_IDENTITY 'Developer ID Application'
          expect_setting "$release_settings" CODE_SIGN_STYLE Manual
          expect_setting "$release_settings" ENABLE_HARDENED_RUNTIME YES
          grep -qE '^[[:space:]]*OTHER_CODE_SIGN_FLAGS = .*--timestamp' <<<"$release_settings" \
            || { echo "::error::Developer ID builds must sign with --timestamp"; exit 1; }
          expect_setting "$settings" CODE_SIGN_STYLE Automatic
          bash -n scripts/release.sh

          # Hardened runtime blocks Apple Events (the Dock toggle) without this.
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.automation.apple-events' Recorder/Recorder.entitlements)" = true

      - name: Build app
        run: |
          xcodebuild \
            -project Recorder.xcodeproj \
            -target Recorder \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # A downloadable app for trying builds without Xcode. Ad-hoc signed: Apple Silicon
      # won't run unsigned code, but without a Developer ID it isn't notarized, so macOS
      # asks to confirm on first launch (see README > Download a build).
      - name: Build downloadable app (Release, ad-hoc signed)
        run: |
          xcodebuild \
            -project Recorder.xcodeproj \
            -target Recorder \
            -configuration Release \
            SYMROOT="$PWD/build" \
            build
          app=build/Release/Recorder.app
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/Recorder"
          mkdir -p dist
          # ditto keeps the bundle's symlinks and executable bits; upload-artifact wouldn't.
          ditto -c -k --keepParent "$app" "dist/Recorder-${GITHUB_SHA::7}.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Recorder-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
